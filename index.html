<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Hit</title>
    <style>
        /* ----- সাদা-কালো ক্রিপি থিম ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
        }

        body {
            background: #0a0a0a;
            color: #d0d0d0;
            min-height: 100vh;
            padding: 1rem 0.8rem 3rem;
            animation: creepBg 12s infinite alternate;
        }

        @keyframes creepBg {
            0%   { background: #0a0a0a; }
            50%  { background: #111111; }
            100% { background: #080808; }
        }

        .app-container {
            max-width: 820px;
            margin: 0 auto;
            position: relative;
        }

        /* ---- হেডার ---- */
        .header {
            text-align: center;
            padding: 1.8rem 0 0.8rem;
            border-bottom: 2px solid #3a3a3a;
            margin-bottom: 1.8rem;
            position: relative;
        }
        .header h1 {
            font-size: 2.6rem;
            font-weight: 700;
            letter-spacing: 4px;
            color: #ececec;
            text-shadow: 0 0 12px rgba(200, 200, 200, 0.15);
            animation: flicker 4s infinite;
        }
        @keyframes flicker {
            0%, 100% { opacity: 1; }
            92% { opacity: 1; }
            93% { opacity: 0.6; }
            94% { opacity: 1; }
            96% { opacity: 0.8; }
            97% { opacity: 1; }
        }
        .header p {
            color: #999;
            font-size: 0.95rem;
            margin-top: 0.2rem;
            letter-spacing: 2px;
        }
        .badge-count {
            display: inline-block;
            background: #1a1a1a;
            padding: 0.2rem 1.6rem;
            border-radius: 40px;
            margin: 0.6rem 0 0.2rem;
            border: 1px solid #444;
            color: #ccc;
            font-weight: 600;
            font-size: 0.9rem;
            animation: pulseBorder 3s infinite;
        }
        @keyframes pulseBorder {
            0%, 100% { border-color: #444; }
            50% { border-color: #777; }
        }

        /* ---- সার্চ ---- */
        .search-wrap {
            margin: 1.2rem 0 1.8rem;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .search-wrap input {
            flex: 1;
            min-width: 180px;
            padding: 0.8rem 1.2rem;
            border-radius: 60px;
            border: 1.5px solid #3a3a3a;
            background: #0f0f0f;
            color: #ddd;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }
        .search-wrap input:focus {
            border-color: #777;
            background: #151515;
            box-shadow: 0 0 20px rgba(180, 180, 180, 0.05);
        }
        .search-wrap input::placeholder {
            color: #555;
            font-weight: 300;
        }
        .filter-btn {
            background: #141414;
            border: 1.5px solid #444;
            color: #ccc;
            padding: 0.8rem 1.4rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.3s;
        }
        .filter-btn.active {
            background: #2a2a2a;
            border-color: #888;
            color: #fff;
        }

        /* ---- কার্ড ---- */
        .card-grid {
            display: flex;
            flex-direction: column;
            gap: 1.4rem;
            margin-top: 0.5rem;
        }

        .spot-card {
            background: #111;
            border-radius: 24px;
            padding: 1.2rem 1.2rem 1rem;
            border-left: 6px solid #444;
            border: 1px solid #2a2a2a;
            transition: 0.25s ease;
            position: relative;
            overflow: hidden;
            animation: cardGlow 6s infinite alternate;
        }
        @keyframes cardGlow {
            0%   { box-shadow: 0 0 5px rgba(150, 150, 150, 0.02); }
            100% { box-shadow: 0 0 25px rgba(180, 180, 180, 0.06); }
        }
        .spot-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 40%, rgba(200, 200, 200, 0.02), transparent 70%);
            pointer-events: none;
            animation: shiftGlow 12s infinite alternate;
        }
        @keyframes shiftGlow {
            0%   { transform: translate(0, 0); }
            100% { transform: translate(10%, 10%); }
        }

        .spot-card:hover {
            background: #191919;
            border-left-width: 8px;
            border-color: #666;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 6px 12px;
            margin-bottom: 0.4rem;
            position: relative;
            z-index: 1;
        }
        .spot-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #f0f0f0;
            letter-spacing: 0.3px;
        }
        .spot-number {
            background: #1e1e1e;
            padding: 0.1rem 0.9rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #aaa;
            border: 1px solid #3a3a3a;
        }
        .spot-desc {
            font-size: 0.95rem;
            color: #c0c0c0;
            margin: 0.6rem 0 0.2rem;
            line-height: 1.5;
            border-left: 2px solid #333;
            padding-left: 0.8rem;
            position: relative;
            z-index: 1;
        }
        .detail-block {
            margin-top: 0.8rem;
            background: #0a0a0a;
            border-radius: 14px;
            padding: 0.8rem 1rem;
            border: 1px solid #262626;
            position: relative;
            z-index: 1;
        }
        .detail-label {
            font-weight: 600;
            color: #d0d0d0;
            display: block;
            margin-bottom: 4px;
            font-size: 0.9rem;
            letter-spacing: 0.3px;
        }
        .detail-text {
            color: #c0c0c0;
            line-height: 1.6;
            font-size: 0.95rem;
        }
        .detail-text strong {
            color: #fff;
            font-weight: 600;
        }
        .time-tag {
            display: inline-block;
            background: #161616;
            padding: 0.15rem 1rem;
            border-radius: 40px;
            font-size: 0.75rem;
            color: #aaa;
            border: 1px solid #3a3a3a;
            margin-top: 6px;
            position: relative;
            z-index: 1;
        }

        /* ---- ফুটার (আইনি + কৌশল) ---- */
        .footer-note {
            margin-top: 2.5rem;
            padding: 1.2rem 1.2rem;
            border-radius: 24px;
            background: #0f0f0f;
            border: 1px solid #2a2a2a;
            text-align: left;
            color: #b0b0b0;
            font-size: 0.9rem;
            line-height: 1.8;
            animation: footerPulse 8s infinite alternate;
        }
        @keyframes footerPulse {
            0%   { border-color: #2a2a2a; }
            100% { border-color: #4a4a4a; }
        }
        .footer-note strong {
            color: #eee;
        }
        .legal-highlight {
            color: #aaa;
            font-weight: 500;
        }
        .strategy-tip {
            color: #ccc;
            font-weight: 500;
        }

        /* ---- মোবাইল রেসপন্সিভ ---- */
        @media (max-width: 480px) {
            .header h1 { font-size: 2.0rem; }
            .spot-title { font-size: 1.1rem; }
            .search-wrap input { min-width: 140px; padding: 0.6rem 1rem; }
            .filter-btn { padding: 0.6rem 1rem; font-size: 0.85rem; }
            .detail-text { font-size: 0.9rem; }
        }
        @media (max-width: 380px) {
            .card-header { flex-direction: column; align-items: flex-start; }
        }

        /* স্ক্রল বার */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 12px; }

        /* ফাঁকা অবস্থা */
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #777;
            background: #0a0a0a;
            border-radius: 40px;
            border: 1px dashed #333;
        }
        .empty-state strong { color: #aaa; }
    </style>
</head>

                description: "ফেমোরাল ধমনী – দ্বিতীয় বৃহত্তম; প্রতি মিনিটে ৫০০ মিলি রক্তক্ষরণ।",
                attack: "ধারালো বস্তু দিয়ে হাঁটুর পেছনে বা উরুর ভেতরে খোঁচা; লাথিতে হাড় ভেঙে ধমনী ছিদ্র।",
                effect: "রক্তচাপ কমে মস্তিষ্কে রক্ত চলাচল বন্ধ; টুর্নিকেট দিলে সময় বাড়ানো সম্ভব।"

        // DOM
        const container = document.getElementById('cardContainer');
        const searchInput = document.getElementById('searchInput');
        const filterBtn = document.getElementById('filterBtn');
        const totalBadge = document.getElementById('totalBadge');

        let currentFilter = 'all';

        // রেন্ডার
        function renderCards(filterText = '', filterType = 'all') {
            const searchTerm = filterText.toLowerCase().trim();
            let filtered = spotsData;

            if (filterType === 'immediate') {
                filtered = filtered.filter(item => {
                    const t = item.time.toLowerCase();
                    return t.includes('সেকেন্ড') || t.includes('তাৎক্ষণিক') || t.includes('অজ্ঞান') || t.includes('৩-৫ সেকেন্ড');
                });
            }

            if (searchTerm !== '') {
                filtered = filtered.filter(item => {
                    const combined = (item.title + item.description + item.attack + item.effect + item.type + item.time).toLowerCase();
                    return combined.includes(searchTerm);
                });
            }

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <strong>কোনও স্পট খুঁজে পাওয়া যায়নি</strong><br />
                        <span style="font-size:0.9rem; color:#666;">অন্য কীওয়ার্ড দিয়ে চেষ্টা করুন</span>
                    </div>
                `;
                return;
            }

            let html = '';
            filtered.forEach((spot, idx) => {
                html += `
                    <div class="spot-card" data-id="${spot.id}">
                        <div class="card-header">
                            <span class="spot-title">${idx+1}. ${spot.title}</span>
                            <span class="spot-number">#${spot.id} · ${spot.type}</span>
                        </div>
                        <div class="spot-desc">${spot.description}</div>
                        <div class="detail-block">
                            <span class="detail-label">আঘাতের ধরন</span>
                            <div class="detail-text">${spot.attack}</div>
                        </div>
                        <div class="detail-block">
                            <span class="detail-label">শারীরিক প্রতিক্রিয়া ও ফল</span>
                            <div class="detail-text">${spot.effect}</div>
                        </div>
                        <div style="display:flex; justify-content: flex-end; margin-top: 8px;">
                            <span class="time-tag">সময়সীমা: ${spot.time}</span>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
            totalBadge.innerText = `${filtered.length}টি মারাত্মক পয়েন্ট ${filterType === 'immediate' ? '(তাৎক্ষণিক)' : ''}`;
        }

        // ইভেন্ট
        searchInput.addEventListener('input', function(e) {
            renderCards(e.target.value, currentFilter);
        });

        filterBtn.addEventListener('click', function() {
            if (currentFilter === 'all') {
                currentFilter = 'immediate';
                filterBtn.classList.add('active');
                filterBtn.textContent = 'তাৎক্ষণিক ✓';
            } else {
                currentFilter = 'all';
                filterBtn.classList.remove('active');
                filterBtn.textContent = 'তাৎক্ষণিক';
            }
            renderCards(searchInput.value, currentFilter);
        });

        // প্রথম রেন্ডার
        renderCards('', 'all');
    })();
</script>
